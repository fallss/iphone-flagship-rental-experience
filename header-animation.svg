<svg fill="none" viewBox="0 0 850 260" width="850" height="260" xmlns="http://www.w3.org/2000/svg">
    <foreignObject width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml">
            <style>
                @keyframes shimmer {
                    0% { background-position: -400px 0; }
                    100% { background-position: 400px 0; }
                }
                @keyframes floatOrb {
                    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.45; }
                    50% { transform: translate(-30px, 15px) scale(1.15); opacity: 0.75; }
                }
                @keyframes pulseBadge {
                    0%, 100% { box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); border-color: rgba(56, 189, 248, 0.5); }
                    50% { box-shadow: 0 0 25px rgba(56, 189, 248, 0.7); border-color: rgba(56, 189, 248, 0.9); }
                }
                @keyframes typewriter {
                    0%, 18% { content: "Interactive 3D Three.js Studio • Rotasi 360° Realtime"; }
                    20%, 38% { content: "Penyewaan Flagship iPhone Resmi • Unit 100% Original"; }
                    40%, 58% { content: "Cosmic Astronomy Engine • Midnight Dark & Pure Frost Light"; }
                    60%, 78% { content: "Zero-Gap Bento Architecture • 5 Paket Kreator & Kru"; }
                    80%, 100% { content: "Kalkulator Sewa Instan • Garansi Swap Kilat & Bebas Deposit"; }
                }
                @keyframes cursorBlink {
                    0%, 100% { opacity: 1; }
                    50% { opacity: 0; }
                }
                .banner-card {
                    position: relative;
                    width: 100%;
                    height: 258px;
                    border-radius: 20px;
                    background: radial-gradient(circle at 80% 20%, rgba(22, 33, 62, 0.95) 0%, rgba(6, 8, 20, 0.98) 70%, #03050c 100%);
                    border: 1px solid rgba(56, 189, 248, 0.28);
                    box-sizing: border-box;
                    padding: 34px 40px;
                    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                    overflow: hidden;
                    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
                }
                .glow-orb-1 {
                    position: absolute;
                    top: -60px;
                    right: -40px;
                    width: 320px;
                    height: 320px;
                    border-radius: 50%;
                    background: radial-gradient(circle, rgba(14, 165, 233, 0.35) 0%, rgba(56, 189, 248, 0.1) 40%, transparent 70%);
                    filter: blur(40px);
                    animation: floatOrb 7s ease-in-out infinite;
                    pointer-events: none;
                }
                .glow-orb-2 {
                    position: absolute;
                    bottom: -80px;
                    left: 20%;
                    width: 260px;
                    height: 260px;
                    border-radius: 50%;
                    background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, transparent 70%);
                    filter: blur(50px);
                    animation: floatOrb 9s ease-in-out infinite reverse;
                    pointer-events: none;
                }
                .badge {
                    display: inline-flex;
                    align-items: center;
                    gap: 8px;
                    padding: 6px 14px;
                    border-radius: 9999px;
                    background: rgba(14, 165, 233, 0.12);
                    border: 1px solid rgba(56, 189, 248, 0.4);
                    color: #38bdf8;
                    font-size: 11px;
                    font-weight: 700;
                    letter-spacing: 1.2px;
                    text-transform: uppercase;
                    margin-bottom: 14px;
                    animation: pulseBadge 3s ease-in-out infinite;
                }
                .badge-dot {
                    width: 7px;
                    height: 7px;
                    border-radius: 50%;
                    background: #38bdf8;
                    box-shadow: 0 0 8px #38bdf8;
                }
                .brand-title {
                    font-size: 38px;
                    font-weight: 800;
                    letter-spacing: -1.2px;
                    margin: 0 0 10px 0;
                    background: linear-gradient(90deg, #ffffff 0%, #cbd5e1 35%, #38bdf8 55%, #ffffff 80%);
                    background-size: 800px 100%;
                    -webkit-background-clip: text;
                    -webkit-text-fill-color: transparent;
                    animation: shimmer 4s linear infinite;
                    display: flex;
                    align-items: center;
                    gap: 12px;
                }
                .brand-tag {
                    font-size: 13px;
                    font-weight: 700;
                    padding: 3px 10px;
                    border-radius: 6px;
                    background: linear-gradient(135deg, #0284c7, #38bdf8);
                    color: #ffffff;
                    letter-spacing: 1px;
                    -webkit-text-fill-color: #ffffff;
                    text-transform: uppercase;
                    vertical-align: middle;
                }
                .dynamic-desc {
                    font-size: 16px;
                    color: #94a3b8;
                    font-weight: 500;
                    display: flex;
                    align-items: center;
                    margin-bottom: 20px;
                    min-height: 24px;
                }
                .typing-text::after {
                    content: "Interactive 3D Three.js Studio • Rotasi 360° Realtime";
                    color: #e2e8f0;
                    font-weight: 600;
                    animation: typewriter 18s steps(1) infinite;
                }
                .cursor {
                    display: inline-block;
                    width: 8px;
                    height: 18px;
                    background: #38bdf8;
                    margin-left: 6px;
                    border-radius: 2px;
                    animation: cursorBlink 0.9s infinite;
                }
                .chips-row {
                    display: flex;
                    gap: 10px;
                    flex-wrap: wrap;
                }
                .chip {
                    font-size: 11px;
                    font-weight: 600;
                    padding: 4px 12px;
                    border-radius: 8px;
                    background: rgba(255, 255, 255, 0.05);
                    border: 1px solid rgba(255, 255, 255, 0.1);
                    color: #94a3b8;
                    letter-spacing: 0.4px;
                }
                .chip-highlight {
                    background: rgba(56, 189, 248, 0.12);
                    border-color: rgba(56, 189, 248, 0.3);
                    color: #7dd3fc;
                }
            </style>
            <div class="banner-card">
                <div class="glow-orb-1"></div>
                <div class="glow-orb-2"></div>
                
                <div class="badge">
                    <span class="badge-dot"></span>
                    <span>FLAGSHIP IPHONE RENTAL PLATFORM</span>
                </div>
                
                <div class="brand-title">
                    <span>ProRent Studio</span>
                    <span class="brand-tag">✦ STUDIO</span>
                </div>
                
                <div class="dynamic-desc">
                    <span class="typing-text"></span>
                    <span class="cursor"></span>
                </div>
                
                <div class="chips-row">
                    <span class="chip chip-highlight">⚡ Three.js 3D Viewport</span>
                    <span class="chip">🪐 Cosmic Astronomy Engine</span>
                    <span class="chip">🍱 Zero-Gap Bento</span>
                    <span class="chip">📊 Live Estimator</span>
                    <span class="chip">📱 100% Responsive</span>
                </div>
            </div>
        </div>
    </foreignObject>
</svg>
