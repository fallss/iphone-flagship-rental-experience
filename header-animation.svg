<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="850" height="260">
  <defs>
    <!-- Background Cosmic Gradients -->
    <radialGradient id="cosmicBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="50%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#030508" />
    </radialGradient>

    <radialGradient id="cyanGlow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="indigoGlow" cx="20%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Frame Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="75%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7" />
    </linearGradient>

    <!-- Titanium Shimmer Gradient with Native SVG SMIL Animation -->
    <linearGradient id="titleShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff">
        <animate attributeName="stop-color" values="#ffffff;#38bdf8;#cbd5e1;#ffffff" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="35%" stop-color="#cbd5e1">
        <animate attributeName="stop-color" values="#cbd5e1;#ffffff;#38bdf8;#cbd5e1" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#cbd5e1;#ffffff;#38bdf8" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="65%" stop-color="#cbd5e1">
        <animate attributeName="stop-color" values="#cbd5e1;#38bdf8;#ffffff;#cbd5e1" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ffffff">
        <animate attributeName="stop-color" values="#ffffff;#cbd5e1;#38bdf8;#ffffff" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Badge Background Gradient -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.12" />
    </linearGradient>

    <linearGradient id="tagBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="chipBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152033" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0c121e" stop-opacity="0.9" />
    </linearGradient>

    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Background Canvas Card -->
  <rect x="2" y="2" width="846" height="256" rx="20" fill="url(#cosmicBg)" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect x="2" y="2" width="846" height="256" rx="20" fill="url(#cyanGlow)" />
  <rect x="2" y="2" width="846" height="256" rx="20" fill="url(#indigoGlow)" />

  <!-- Background Decorative Cosmic Grid Lines -->
  <line x1="2" y1="70" x2="848" y2="70" stroke="rgba(255,255,255,0.025)" stroke-width="1" />
  <line x1="2" y1="180" x2="848" y2="180" stroke="rgba(255,255,255,0.025)" stroke-width="1" />
  <line x1="212" y1="2" x2="212" y2="258" stroke="rgba(255,255,255,0.02)" stroke-width="1" />
  <line x1="638" y1="2" x2="638" y2="258" stroke="rgba(255,255,255,0.02)" stroke-width="1" />

  <!-- Cosmic Starfield Particles with SMIL Animations -->
  <circle cx="100" cy="55" r="1.8" fill="#38bdf8">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="745" cy="85" r="2.2" fill="#ffffff">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="185" cy="195" r="1.6" fill="#38bdf8">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.8s" repeatCount="indefinite" />
  </circle>
  <circle cx="690" cy="205" r="1.8" fill="#7dd3fc">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="425" cy="15" r="1.5" fill="#ffffff">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.5s" repeatCount="indefinite" />
  </circle>

  <!-- Twinkling Diamond Star Sparkles -->
  <path d="M 0,-5 L 1.2,-1.2 L 5,0 L 1.2,1.2 L 0,5 L -1.2,1.2 L -5,0 L -1.2,-1.2 Z" fill="#7dd3fc" transform="translate(68, 120)">
    <animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.2s" repeatCount="indefinite" />
  </path>
  <path d="M 0,-4.5 L 1,-1 L 4.5,0 L 1,1 L 0,4.5 L -1,1 L -4.5,0 L -1,-1 Z" fill="#ffffff" transform="translate(782, 130)">
    <animate attributeName="opacity" values="0.15;1;0.15" dur="3.8s" repeatCount="indefinite" />
  </path>
  <circle cx="75" cy="165" r="1.2" fill="#64748b" opacity="0.6" />
  <circle cx="765" cy="50" r="1.2" fill="#64748b" opacity="0.6" />
  <circle cx="280" cy="40" r="1.2" fill="#64748b" opacity="0.5" />
  <circle cx="560" cy="35" r="1.2" fill="#64748b" opacity="0.5" />

  <!-- Top Pill Badge: FLAGSHIP IPHONE RENTAL PLATFORM -->
  <g transform="translate(425, 38)">
    <rect x="-160" y="-13" width="320" height="26" rx="13" fill="url(#badgeBg)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="-136" cy="0" r="3.5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      <animate attributeName="r" values="3;4.2;3" dur="2s" repeatCount="indefinite" />
    </circle>
    <text class="font-sans" x="5" y="4.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#38bdf8" letter-spacing="1.2">FLAGSHIP IPHONE RENTAL PLATFORM</text>
  </g>

  <!-- Main Brand Title Group: Perfectly Centered -->
  <g transform="translate(425, 116)">
    <!-- ProRent Studio Text -->
    <text class="font-sans" x="-46" y="0" text-anchor="middle" font-size="44" font-weight="800" letter-spacing="-1.2" fill="url(#titleShimmer)">ProRent Studio</text>
    
    <!-- Studio Tag Badge -->
    <g transform="translate(112, -29)">
      <rect width="80" height="26" rx="6" fill="url(#tagBg)" />
      <text class="font-sans" x="40" y="17" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" letter-spacing="1">✦ STUDIO</text>
    </g>
  </g>

  <!-- Dynamic Subtitle / Tagline -->
  <text class="font-sans" x="425" y="156" text-anchor="middle" font-size="14.5" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
    Penyewaan Flagship iPhone Resmi • Pengalaman 3D Real-Time • Arsitektur Titanium
  </text>

  <!-- Feature Chips / Pills Row -->
  <g transform="translate(48, 190)">
    <!-- Chip 1: Three.js 3D Viewport -->
    <g transform="translate(0, 0)">
      <rect width="162" height="30" rx="8" fill="url(#chipBg)" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1" />
      <text class="font-sans" x="81" y="19" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7dd3fc">⚡ Three.js 3D Viewport</text>
    </g>

    <!-- Chip 2: Cosmic Starfield -->
    <g transform="translate(172, 0)">
      <rect width="144" height="30" rx="8" fill="url(#chipBg)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text class="font-sans" x="72" y="19" text-anchor="middle" font-size="11.5" font-weight="600" fill="#cbd5e1">🪐 Cosmic Starfield</text>
    </g>

    <!-- Chip 3: Zero-Gap Bento -->
    <g transform="translate(326, 0)">
      <rect width="134" height="30" rx="8" fill="url(#chipBg)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text class="font-sans" x="67" y="19" text-anchor="middle" font-size="11.5" font-weight="600" fill="#cbd5e1">🍱 Zero-Gap Bento</text>
    </g>

    <!-- Chip 4: Live Estimator -->
    <g transform="translate(470, 0)">
      <rect width="128" height="30" rx="8" fill="url(#chipBg)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text class="font-sans" x="64" y="19" text-anchor="middle" font-size="11.5" font-weight="600" fill="#cbd5e1">📊 Live Estimator</text>
    </g>

    <!-- Chip 5: 100% Responsive -->
    <g transform="translate(608, 0)">
      <rect width="146" height="30" rx="8" fill="url(#chipBg)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text class="font-sans" x="73" y="19" text-anchor="middle" font-size="11.5" font-weight="600" fill="#cbd5e1">📱 100% Responsive</text>
    </g>
  </g>
</svg>
